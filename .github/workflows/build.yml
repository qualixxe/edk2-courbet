name: Build UEFI for courbet

on:
  workflow_dispatch:
  push:
    paths:
      - "**.dsc"
      - "**.dec"
      - "**.inf"
      - "**.fdf"
      - "**.c"
      - "**.h"
      - ".github/workflows/build-courbet.yml"
  pull_request:
    paths:
      - "**.dsc"
      - "**.dec"
      - "**.inf"
      - "**.fdf"
      - "**.c"
      - "**.h"
      - ".github/workflows/build-courbet.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            uuid-dev \
            acpica-tools \
            nasm \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu

      - name: Find courbet DSC
        id: dsc
        shell: bash
        run: |
          dsc="$(find . -type f -iname '*courbet*.dsc' -not -path '*/Build/*' -print -quit)"
          if [[ -z "$dsc" ]]; then
            echo "::error::Не найден DSC для courbet. Добавь платформенный файл с courbet в имени."
            exit 1
          fi
          echo "path=$dsc" >> "$GITHUB_OUTPUT"
          echo "Используется DSC: $dsc"

      - name: Build EDK2 BaseTools
        run: |
          make -C BaseTools

      - name: Build courbet
        shell: bash
        env:
          GCC5_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          source edksetup.sh
          build \
            -a AARCH64 \
            -t GCC5 \
            -p "${{ steps.dsc.outputs.path }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-courbet
          path: |
            Build/**/*.efi
            Build/**/*.fd
            Build/**/*.img
          if-no-files-found: error