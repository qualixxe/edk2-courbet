name: Build Courbet UEFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout edk2-msm
        uses: actions/checkout@v4
        with:
          repository: 'edk2-porting/edk2-msm'
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # ⬇️ Добавлен gettext (для msgfmt), flex и bison
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-pip python-is-python3 gettext flex bison
          pip install --upgrade pip
          pip install edk2-pytool-library edk2-pytool-extensions

      - name: Create Courbet Configuration
        run: |
          mkdir -p Platform/Xiaomi/sm7150/courbet/FdtBlob_compat
          mkdir -p configs/devices/

          # 1. Скачиваем DTB для courbet
          curl -L -o Platform/Xiaomi/sm7150/courbet/FdtBlob_compat/courbet.dtb "https://raw.githubusercontent.com/sm7150-mainline/downstream-fdt/main/fdt-courbet"

          # 2. Создаем файл courbet.conf
          cat << 'EOF' > configs/devices/courbet.conf
          DEVICE_DISPLAY_WIDTH=1080
          DEVICE_DISPLAY_HEIGHT=2400
          DEVICE_DISPLAY_DPI=395
          EOF

          # 3. Создаем courbet.dsc (описание платформы)
          cat << 'EOF' > Platform/Xiaomi/sm7150/courbet/courbet.dsc
          [Defines]
            PLATFORM_NAME                  = courbet
            PLATFORM_GUID                  = 11111111-2222-3333-4444-555555555555
            PLATFORM_VERSION               = 1.0
            DSC_SPECIFICATION              = 0x00010005
            OUTPUT_DIRECTORY               = Build/sm7150/courbet
            SUPPORTED_ARCHITECTURES        = AARCH64
            BUILD_TARGETS                  = DEBUG|RELEASE
            SKUID_IDENTIFIER               = DEFAULT
            FLASH_DEFINITION               = Platform/Xiaomi/sm7150/courbet/courbet.fdf.inc

          [LibraryClasses]
            !include Platform/Xiaomi/sm7150/sm7150.dsc.inc

          [PcdsFixedAtBuild]
            gEfiMdeModulePkgTokenSpaceGuid.PcdVideoHorizontalResolution|1080
            gEfiMdeModulePkgTokenSpaceGuid.PcdVideoVerticalResolution|2400
            gEfiMdeModulePkgTokenSpaceGuid.PcdSetupVideoHorizontalResolution|1080
            gEfiMdeModulePkgTokenSpaceGuid.PcdSetupVideoVerticalResolution|2400
          EOF

          # 4. Создаем courbet.fdf.inc (сборка флеш-образа)
          cat << 'EOF' > Platform/Xiaomi/sm7150/courbet/courbet.fdf.inc
          [Defines]
          FvNameGuid         = 763BED0D-DE9F-48F5-81F1-3E90E1B1A015

          !include Platform/Xiaomi/sm7150/sm7150.fdf.inc
          EOF

      - name: Build UEFI
        run: |
          chmod +x build.sh
          ./build.sh -d courbet

      - name: Upload UEFI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-courbet-image
          path: |
            Build/sm7150/courbet/**/*.img
            Build/sm7150/courbet/**/*.fd
          retention-days: 7