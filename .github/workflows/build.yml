name: Build Courbet UEFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout edk2-msm
        uses: actions/checkout@v4
        with:
          repository: 'edk2-porting/edk2-msm'
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-pip python-is-python3 gettext flex bison \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          pip install --upgrade pip
          pip install edk2-pytool-library edk2-pytool-extensions

      - name: Create Courbet Configuration
        run: |
          mkdir -p Platform/Xiaomi/sm7150/courbet/FdtBlob_compat
          mkdir -p configs/devices/

          # 1. Скачиваем DTB для courbet
          curl -L -o Platform/Xiaomi/sm7150/courbet/FdtBlob_compat/courbet.dtb \
            "https://raw.githubusercontent.com/sm7150-mainline/downstream-fdt/main/fdt-courbet"

          # 2. Создаем файл courbet.conf
          cat << 'EOF' > configs/devices/courbet.conf
          SOC_PLATFORM=sm7150
          DEVICE_DISPLAY_WIDTH=1080
          DEVICE_DISPLAY_HEIGHT=2400
          DEVICE_DISPLAY_DPI=395
          EOF

          # 3. Скачиваем оба файла (dsc и fdf.inc) от surya
          curl -L -o Platform/Xiaomi/sm7150/courbet/courbet.dsc \
            "https://raw.githubusercontent.com/edk2-porting/edk2-msm/master/Platform/Xiaomi/sm7150/surya.dsc"
          curl -L -o Platform/Xiaomi/sm7150/courbet/courbet.fdf.inc \
            "https://raw.githubusercontent.com/edk2-porting/edk2-msm/master/Platform/Xiaomi/sm7150/surya.fdf.inc"

          # Проверяем, что скачалось (выводим первые 5 строк в лог)
          echo "=== HEAD OF DSC ==="
          head -n 5 Platform/Xiaomi/sm7150/courbet/courbet.dsc
          echo "=== HEAD OF FDF ==="
          head -n 5 Platform/Xiaomi/sm7150/courbet/courbet.fdf.inc

          # 4. Заменяем название устройства surya на courbet
          sed -i 's/surya/courbet/g' Platform/Xiaomi/sm7150/courbet/courbet.dsc
          sed -i 's/surya/courbet/g' Platform/Xiaomi/sm7150/courbet/courbet.fdf.inc

          # 5. Меняем разрешение экрана и DPI
          sed -i 's/PcdMipiFrameBufferWidth|.*/PcdMipiFrameBufferWidth|1080/' Platform/Xiaomi/sm7150/courbet/courbet.dsc
          sed -i 's/PcdMipiFrameBufferHeight|.*/PcdMipiFrameBufferHeight|2400/' Platform/Xiaomi/sm7150/courbet/courbet.dsc
          sed -i 's/PcdGuiDefaultDPI|.*/PcdGuiDefaultDPI|395/' Platform/Xiaomi/sm7150/courbet/courbet.dsc

      - name: Build UEFI
        run: |
          chmod +x build.sh
          ./build.sh -d courbet

      - name: Upload UEFI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-courbet-image
          path: |
            Build/sm7150/courbet/**/*.img
            Build/sm7150/courbet/**/*.fd
          retention-days: 7