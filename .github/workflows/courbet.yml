name: courbet UEFI

on:
  push:
    branches: [courbet]
  workflow_dispatch:

concurrency:
  group: courbet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware build
    # 22.04 rather than latest: the edk2 BaseTools here still expect
    # python3-distutils, which newer runners no longer ship.
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev clang llvm iasl nasm \
            gcc-aarch64-linux-gnu abootimg \
            python3 python3-distutils python3-pil python3-git gettext \
            cpio zip unzip

      - name: Fetch submodules
        run: bash .github/scripts/fetch_submodules.sh

      - name: Build firmware
        run: ./build.sh --device courbet

      - name: Show result
        run: |
          ls -la boot-courbet.img
          sha256sum boot-courbet.img

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: boot-courbet
          path: boot-courbet.img
